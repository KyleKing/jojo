# The `project` CI job runs this task when it exists; `golangci-lint run` accepts an
# invalid config silently, so the schema check is the only gate that catches one.
[tasks."ci:project"]
description = "Verify .golangci.toml against the installed linter's schema"
run = "golangci-lint config verify"

# Overrides the template's task, which runs every tape in the tree but
# stills.tape. The README's recordings are demo/*.tape less stills.tape, each
# opening a scene of demo/scene.sh, and each gif is shrunk after recording: 64
# colors keeps the truecolor syntax palette and the add and remove bands, which
# fewer flattens to grey. demo:stills is the template's and is unchanged.
[tasks.demo]
description = "Generate the README's VHS recordings into docs/images"
depends = ["build"]
shell = "bash -c"
run = '''
set -euo pipefail
mkdir -p docs/images
for tape in demo/*.tape; do
  [ "$(basename "$tape")" = stills.tape ] && continue
  vhs "$tape"
  gif=docs/images/$(basename "$tape" .tape).gif
  ffmpeg -v error -y -i "$gif" -vf "fps=6,split[a][b];[a]palettegen=max_colors=64:stats_mode=diff[p];[b][p]paletteuse=dither=none:diff_mode=rectangle" "$gif.tmp.gif"
  mv "$gif.tmp.gif" "$gif"
done
'''
